name: Windows tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Expose the bundled MCP command
        run: |
          $interpreter = (Get-Command python.exe).Source
          $aliasPath = Join-Path (Split-Path $interpreter) 'python3.exe'
          if (!(Test-Path $aliasPath)) { Copy-Item $interpreter $aliasPath }
      - name: Run Python tests
        run: |
          Get-ChildItem test -Recurse -Filter 'test_*.py' | ForEach-Object {
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
